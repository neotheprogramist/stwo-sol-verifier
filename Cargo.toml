[workspace]
resolver = "2"
members = ["crates/contracts", "crates/verifier",]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Alloy framework for Ethereum interaction
alloy = { version = "0.4", features = ["full", "node-bindings"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-contract = "0.4"
alloy-provider = "0.4"
alloy-network = "0.4"
alloy-signer = "0.4"
alloy-signer-local = "0.4"

# STWO dependencies
stwo = { git = "https://github.com/piotr-stec/stwo-fork-keccak", features = ["prover"], branch = "channel/solidity" }
stwo-constraint-framework = { git = "https://github.com/piotr-stec/stwo-fork-keccak", features = ["prover", "std"], branch = "channel/solidity" }

# Common dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"
num-traits = "0.2"
